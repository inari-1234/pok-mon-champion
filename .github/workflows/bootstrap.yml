name: Bootstrap Champion Coach repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: champion-coach-bootstrap
  cancel-in-progress: false

jobs:
  restore:
    if: ${{ hashFiles('core.js') == '' && hashFiles('.bootstrap/payload.00') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reassemble repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat             .bootstrap/payload.00 .bootstrap/payload.01 .bootstrap/payload.02 .bootstrap/payload.03 .bootstrap/payload.04             .bootstrap/tail.00 .bootstrap/tail.01 .bootstrap/tail.02 .bootstrap/tail.03 .bootstrap/tail.04             > /tmp/champion-coach.b64
          base64 --decode /tmp/champion-coach.b64 > /tmp/champion-coach.xz
          xz --test /tmp/champion-coach.xz
          mkdir -p /tmp/champion-coach-restore
          xz --decompress --stdout /tmp/champion-coach.xz > /tmp/champion-coach.payload
          if tar --list --file=/tmp/champion-coach.payload >/tmp/champion-coach-files.txt 2>/dev/null; then
            tar --extract --file=/tmp/champion-coach.payload --directory=/tmp/champion-coach-restore
          else
            echo "Decoded payload is not a tar archive."
            file /tmp/champion-coach.payload || true
            exit 1
          fi
          echo "Archive entries:"
          cat /tmp/champion-coach-files.txt
          shopt -s dotglob nullglob
          restored=(/tmp/champion-coach-restore/*)
          if [ ${#restored[@]} -eq 1 ] && [ -d "${restored[0]}" ]; then
            cp -a "${restored[0]}/." .
          else
            cp -a /tmp/champion-coach-restore/. .
          fi
          test -f core.js
          test -f app.js
          test -f styles.css
          test -f pokemon-data.js
          test -f competitive-data.js
          test -f tests/core.test.js
      - name: Remove bootstrap transport
        run: |
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
      - name: Pre-commit syntax checks
        run: |
          node --check pokemon-data.js
          node --check competitive-data.js
          node --check core.js
          node --check app.js
      - name: Commit restored application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No restored changes to commit."
            exit 0
          fi
          git commit -m "Restore Champion Coach v0.6.1 application"
          git push origin HEAD:main
