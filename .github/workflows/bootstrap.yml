name: Restore exact Champion Coach repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: champion-coach-bootstrap
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and restore exact payload
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap2
          count="$(find .bootstrap2 -maxdepth 1 -type f -name 'chunk.*' | wc -l | tr -d ' ')"
          test "$count" = "23"

          cat .bootstrap2/chunk.* > /tmp/champion-coach.b64
          size="$(wc -c < /tmp/champion-coach.b64 | tr -d ' ')"
          test "$size" = "88044"

          base64 --decode /tmp/champion-coach.b64 > /tmp/champion-coach.tar.xz
          echo "5146ae3e4cb8a9ec158b01ab0ed262d2aacd53195d91717561f742f491eb355c  /tmp/champion-coach.tar.xz" | sha256sum --check -
          xz --test /tmp/champion-coach.tar.xz

          rm -rf /tmp/champion-coach-restore
          mkdir -p /tmp/champion-coach-restore
          tar -xJf /tmp/champion-coach.tar.xz -C /tmp/champion-coach-restore

          test -f /tmp/champion-coach-restore/core.js
          test -f /tmp/champion-coach-restore/app.js
          test -f /tmp/champion-coach-restore/styles.css
          test -f /tmp/champion-coach-restore/pokemon-data.js
          test -f /tmp/champion-coach-restore/competitive-data.js
          test -f /tmp/champion-coach-restore/tests/core.test.js

          cp -a /tmp/champion-coach-restore/. .

          rm -rf .bootstrap .bootstrap2
          rm -f .github/workflows/bootstrap.yml

      - name: Install static-check dependency
        run: python -m pip install beautifulsoup4

      - name: Verify restored application
        shell: bash
        run: |
          set -euo pipefail
          node --check pokemon-data.js
          node --check competitive-data.js
          node --check core.js
          node --check app.js
          node --check sw.js
          node --test tests/core.test.js
          node tests/runtime_smoke.js
          python tests/static_check.py

      - name: Commit exact repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "Restore exact Champion Coach v0.6.1 repository"
          git push origin HEAD:main
