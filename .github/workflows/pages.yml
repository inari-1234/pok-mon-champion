name: Deploy Champion Coach to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install static-check dependency
        run: python -m pip install beautifulsoup4
      - name: Run validation suite
        run: |
          node --check pokemon-data.js
          node --check competitive-data.js
          node --check single-competitive-data.js
          node --check core.js
          node --check app.js
          node --check sw.js
          node --test tests/core.test.js
          node tests/runtime_smoke.js
          python tests/static_check.py

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html styles.css pokemon-data.js competitive-data.js single-competitive-data.js core.js app.js manifest.webmanifest sw.js version.json latest.json .nojekyll _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
